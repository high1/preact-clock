name: Update Dependencies 🔄

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update-dependencies:
    if: github.repository == 'high1/preact-clock' # Don't run on forks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pnpm 🧱
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      - name: Update dependencies 🔄
        # The only tag is older than the action's own fixes, so a commit is
        # pinned instead.
        uses: pnpm/update@2457663d4150026edd3adb62b660eb85571bc7cb
        with:
          github-actions: true
          token: ${{ secrets.UPDATE_TOKEN }}
          # The browser has to match the playwright the update brought in, so
          # it is installed after the update and before the verification.
          post-update: pnpm playwright
          # TypeScript 7 is the native rewrite, and the eslint plugins need
          # the JavaScript API it does not have.
          exclude: typescript
          verify: |
            pnpm check
            pnpm lint
            pnpm test
            pnpm build
