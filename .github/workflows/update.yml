name: Update Dependencies 🔄

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update-dependencies:
    if: github.repository == 'high1/preact-clock' # Don't run on forks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1

      # Installs the pnpm version and the runtime from devEngines.
      - name: Pnpm 🧱
        uses: pnpm/setup@v3.1.1

      # Updates the dependencies, the pinned pnpm and the pinned runtime, and
      # opens a pull request with the result.
      - name: Update dependencies 🔄
        uses: pnpm/update@v0.0.0
        with:
          # The pull request is only opened if the update passes the checks.
          verify: |
            pnpm check
            pnpm lint
            pnpm test
            pnpm build
