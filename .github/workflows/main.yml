name: Build and Deploy 🕛
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  BASE: /${{ github.event.repository.name }}/

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pnpm 🧱
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Audit 🛡️
        run: pnpm audit

      - name: Install playwright 🌐
        run: pnpm playwright

      - name: Check 🔎
        run: pnpm check

      - name: Lint 🧹
        run: pnpm lint

      - name: Test 🧪
        run: pnpm test

      # getSecondsSinceMidnight has to survive DST transitions, and the rules
      # differ per region - so sweep zones with different rules and both
      # hemispheres instead of trusting the runner's default timezone.
      - name: Test across timezones 🌍
        run: |
          for tz in America/New_York Europe/Berlin Australia/Sydney; do
            echo "::group::$tz"
            TZ=$tz VITE_TZ=$tz pnpm vitest run test/time.test.ts
            echo "::endgroup::"
          done

      - name: Build 🚧
        run: pnpm build

      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages 🚀
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: github.ref == 'refs/heads/main'
